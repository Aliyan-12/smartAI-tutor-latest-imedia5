services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-}"]
      interval: 5s
      timeout: 5s
      retries: 5

  presenton:
    image: ghcr.io/presenton/presenton:latest
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      LLM: google
      GOOGLE_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_MODEL: models/gemini-2.5-flash
      IMAGE_PROVIDER: pexels
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      CAN_CHANGE_KEYS: "false"
      AUTH_USERNAME: ${PRESENTON_USER:-}
      AUTH_PASSWORD: ${PRESENTON_PASSWORD:-}
    volumes:
      - presenton_data:/app_data
      - ./presenton-patches/get_layout_by_name.py:/app/servers/fastapi/templates/get_layout_by_name.py:ro
      - ./presenton-patches/export_utils.py:/app/servers/fastapi/utils/export_utils.py:ro

  backend:
    build: ./backend
    restart: unless-stopped
    # WebSocket keepalive: long session turns must not be dropped by uvicorn's
    # default 20s ws ping timeout (overrides the image CMD; no rebuild needed).
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      --ws-ping-interval 30 --ws-ping-timeout 300 --timeout-keep-alive 300
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      presenton:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      PRESENTON_URL: http://presenton
      PRESENTON_PUBLIC_URL: http://localhost:5000
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  presenton_data:
  backend_uploads:
