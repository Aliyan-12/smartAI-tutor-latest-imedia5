services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      --ws-ping-interval 30 --ws-ping-timeout 300 --timeout-keep-alive 300
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      GEMINI_SESSION_MODEL: ${GEMINI_SESSION_MODEL:-gemini-2.5-pro}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      RESOURCE_SYNC_ENABLED: ${RESOURCE_SYNC_ENABLED:-true}
      CURRICULUM_SYNC_HOURS: ${CURRICULUM_SYNC_HOURS:-12}
      RESOURCE_SYNC_HOURS: ${RESOURCE_SYNC_HOURS:-6}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8001}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
  hf_cache: