# Casbin RBAC-with-domains model.
# Subject is a role token ("role:teacher"); domain is the tenant ("school:7").
# Casbin answers "can this ROLE do ACT on OBJ?"; cross-school isolation is
# enforced at the service layer (queries filtered by school_id). The domain is
# threaded through so per-school policy overrides can be added later without
# changing call sites. Policies use dom/obj/act = "*" as wildcards.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && (p.dom == "*" || r.dom == p.dom) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
